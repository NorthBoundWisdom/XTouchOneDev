name: Checks
on: [push, pull_request]

permissions:
  contents: read
  actions: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize locked ControlSurfaceKit
        run: python3 -B configs/control_surface_kit_dependency.py ensure
      - name: Run adapter tests
        run: swift test --scratch-path build/swiftpm
      - name: Enforce 300-second push budget
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B configs/check_push_budget.py

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize locked ControlSurfaceKit
        run: python3 -B configs/control_surface_kit_dependency.py ensure
      - name: Run adapter tests
        run: swift test --scratch-path build/swiftpm
      - name: Enforce 300-second push budget
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B configs/check_push_budget.py
